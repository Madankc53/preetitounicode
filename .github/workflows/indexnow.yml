name: Notify IndexNow

on:
  workflow_run:
    workflows: ["Generate Sitemap"]
    types: [completed]
  workflow_dispatch:

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Submit sitemap URLs to IndexNow
        # IndexNow wants page URLs, not the sitemap address. Read them from the
        # freshly generated sitemap.xml and submit them in one request.
        run: |
          python3 - <<'PY'
          import json, re, urllib.request

          host = "converter.thenepal.io"
          key = "886412cc-eca6-4ebc-bcd2-aaf27dc54847"
          xml = open("sitemap.xml", encoding="utf-8").read()
          urls = re.findall(r"<loc>([^<]+)</loc>", xml)
          body = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": f"https://{host}/{key}.txt",
              "urlList": urls,
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          with urllib.request.urlopen(req) as resp:
              print("IndexNow status:", resp.status, "for", len(urls), "URLs")
          PY
