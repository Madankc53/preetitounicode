name: Generate Sitemap

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - '_headers'
      - '_redirects'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so lastmod dates match real git history

      - name: Generate Sitemap
        # Lists only indexable pages, in the URL form Cloudflare actually serves
        # (no .html, directory pages with a trailing slash). Prints warnings for
        # pages whose canonical tag disagrees with their real URL.
        run: python3 generate_sitemap_automated.py

      - name: Commit and Push Sitemap
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "Automated sitemap update"
          git push
